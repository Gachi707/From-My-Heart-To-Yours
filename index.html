<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From My Heart to Yours</title>
  <meta name="description" content="Write a love letter and send it as a private link.">
<meta name="theme-color" content="#3b0a14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Dancing+Script:wght@500&family=Libre+Baskerville&family=Source+Sans+3&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <h1>From My Heart to Yours</h1>
    <p class="tagline">Every letter is how long I thought of you.</p>
  </header>

  <main>
    <div class="reading-banner" id="reading-banner" hidden>
  <p>A letter has been sent to you</p>
  <div class="banner-buttons">
    <button type="button" class="photo-btn" id="reply-btn">Write a reply</button>
    <button type="button" class="photo-btn" id="write-own">Write my own letter</button>
    <button type="button" class="photo-btn" data-print>Print this letter</button>
  </div>
</div>
    <div class="style-picker" role="group" aria-label="Text style">
      <button type="button" class="style-btn is-active" data-style="classic" aria-pressed="true">Classic</button>
      <button type="button" class="style-btn" data-style="signature" aria-pressed="false">Signature</button>
      <button type="button" class="style-btn" data-style="editor" aria-pressed="false">Editor</button>
      <button type="button" class="style-btn" data-style="typewriter" aria-pressed="false">Typewriter</button>
      <button type="button" class="style-btn" data-style="elegant" aria-pressed="false">Elegant</button>
      <button type="button" class="style-btn" data-style="literature" aria-pressed="false">Literature</button>
    </div>  <div class="photo-actions">
  <button type="button" class="photo-btn" id="add-photo">Add recipient's photo</button>
  <button type="button" class="photo-btn" id="remove-photo" hidden>Remove photo</button>
  <input type="file" id="photo-input" accept="image/*" hidden>
  <p class="photo-error" id="photo-error" role="alert" hidden></p>
    <button type="button" class="photo-btn" id="new-letter">New letter</button>
  <p class="save-status" id="save-status" role="status" aria-live="polite"></p>
</div>

    <article class="notebook" data-style="classic">
        <div class="photo-layer" id="photo-layer" aria-hidden="true"></div>
      <div class="letter-header">
        <div class="field field-date">
          <label for="letter-date">Date</label>
          <input type="date" id="letter-date">
        </div>

        <div class="field">
          <label for="letter-to">To</label>
          <input type="text" id="letter-to" placeholder="Who is this letter for?" maxlength="60">
        </div>

        <div class="field">
          <label for="letter-from">From</label>
          <input type="text" id="letter-from" placeholder="Your name" maxlength="60">
        </div>
      </div>

      <textarea
        class="letter-body"
        placeholder="My dearest..."
        aria-label="Write your letter"></textarea>
    </article><section class="share-panel" id="share-panel">
  <label class="share-option">
    <input type="checkbox" id="share-include-photo" checked>
    Include the photo in the link
  </label>
  <button type="button" class="photo-btn" id="create-link">Create share link</button>
  <button type="button" class="photo-btn" data-print>Print letter</button>
  
  <div class="share-result" id="share-result" hidden>
    <input type="text" id="share-link" readonly aria-label="Share link">
    <button type="button" class="photo-btn" id="copy-link">Copy link</button>
  </div>

  <p class="share-note" id="share-note" role="status" aria-live="polite"></p>
</section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
