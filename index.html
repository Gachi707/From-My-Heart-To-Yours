<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From My Heart to Yours</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>From My Heart to Yours</h1>
    <p class="tagline">Every letter is how long I thought of you.</p>
  </header>

  <main>
    <article class="notebook">
      <div class="letter-header">
  <div class="field field-date">
    <label for="letter-date">Date</label>
    <input type="date" id="letter-date">
  </div>

  <div class="field">
    <label for="letter-to">To</label>
    <input type="text" id="letter-to" placeholder="Who is this letter for?" maxlength="60">
  </div>

  <div class="field">
    <label for="letter-from">From</label>
    <input type="text" id="letter-from" placeholder="Your name" maxlength="60">
  </div>
</div>

      <textarea
        class="letter-body"
        placeholder="My dearest..."
        aria-label="Write your letter"></textarea>
    </article>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
